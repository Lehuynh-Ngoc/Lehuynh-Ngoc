<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#1B2740"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34E7E4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" rx="3" fill="url(#base)"/>
  <rect x="-360" y="0" width="360" height="6" rx="3" fill="url(#shine)">
    <animate attributeName="x" values="-360;1200" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
